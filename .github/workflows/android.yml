name: Build StormPulse Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  build:
    name: Build StormPulse APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint checks
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug and release variants
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload StormPulse APK
        uses: actions/upload-artifact@v6
        with:
          name: StormPulse-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
